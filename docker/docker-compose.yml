services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: parking-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    container_name: parking-postgres
    environment:
      POSTGRES_DB: parking_db
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: parking_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Named distinctly from any other local project's "parking-mcp" container
    # to avoid a docker container-name collision.
    container_name: parking-chatbot-mcp
    command: ["python", "-m", "app.mcp.server"]
    env_file:
      - ../.env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8010
    ports:
      # Host port 8010 (not 8001): 8001 is occupied on this machine by an
      # unrelated container's Rancher Desktop/WSL port forwarding.
      - "8010:8010"
    volumes:
      - reservations_data:/srv/app/data/reservations

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: parking-app
    env_file:
      - ../.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MCP_HOST: mcp
      MCP_PORT: 8010
    depends_on:
      - qdrant
      - postgres
      - mcp
    ports:
      - "8000:8000"
    volumes:
      - checkpoint_data:/srv/app/data/state

volumes:
  qdrant_data:
  postgres_data:
  reservations_data:
  checkpoint_data:
